databaseChangeLog:
  - changeSet:
      id: 006-1-create-idempotency-keys
      author: bankcore
      changes:
        - createTable:
            tableName: idempotency_keys
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: request_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: response_code
                  type: INT
              - column:
                  name: response_body
                  type: JSONB
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
  - changeSet:
      id: 006-2-idempotency-fk
      author: bankcore
      changes:
        - addForeignKeyConstraint:
            baseTableName: idempotency_keys
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_idempotency_user
            onDelete: RESTRICT
  - changeSet:
      id: 006-3-idempotency-unique
      author: bankcore
      changes:
        - addUniqueConstraint:
            tableName: idempotency_keys
            columnNames: user_id,idempotency_key
            constraintName: uk_user_idempotency
  - changeSet:
      id: 006-4-idempotency-checks
      author: bankcore
      changes:
        - sql:
            dbms: postgresql
            sql: >
              ALTER TABLE idempotency_keys ADD CONSTRAINT ck_idempotency_status CHECK (status IN ('IN_PROGRESS', 'COMPLETED', 'FAILED'));
              ALTER TABLE idempotency_keys ADD CONSTRAINT ck_idempotency_response_code CHECK (response_code IS NULL OR response_code BETWEEN 100 AND 599);
      rollback: >
        ALTER TABLE idempotency_keys DROP CONSTRAINT IF EXISTS ck_idempotency_response_code;
        ALTER TABLE idempotency_keys DROP CONSTRAINT IF EXISTS ck_idempotency_status;
